<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Security Headers (Phase 0 Node 0.1 - Financial Grade) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" /> <!-- Until production ready -->
    
    <!-- Content Security Policy (CSP) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; 
               script-src 'self' 'unsafe-inline' blob:; 
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
               font-src 'self' https://fonts.gstatic.com; 
               img-src 'self' data: blob: https://assets.coingecko.com; 
               connect-src 'self' 
                         wss://stream.binance.com:9443 
                         wss://stream.binance.com:443 
                         https://api.coingecko.com 
                         https://api.0379.world 
                         https://test-api.0379.world 
                         https://trading.yyc3.vip
                         http://localhost:3188 
                         ws://localhost:3188; 
               worker-src 'self' blob:; 
               frame-ancestors 'none'; 
               base-uri 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="YYC3-QATS — 面向专业量化交易者的全功能 Web 应用，涵盖市场分析、策略回测、风险管控、实盘交易完整业务链条"
    />
    <meta name="theme-color" content="#071425" />
    <meta name="keywords" content="YYC3,QATS,量化交易,加密货币,策略回测,风险管理,Binance,CoinGecko" />
    <meta name="author" content="YanYuCloudCube Team" />
    <meta property="og:title" content="YYC3-QATS — 深空蓝量化交易系统" />
    <meta
      property="og:description"
      content="面向专业量化交易者的全功能 Web 应用，涵盖市场分析、策略回测、风险管控、实盘交易完整业务链条"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trading.yyc3.vip" />
    <meta property="og:image" content="/yyc3.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>YYC3-QATS — 深空蓝量化交易系统</title>

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YYC3" />
    <link rel="apple-touch-icon" href="/yyc3-pwa-icon.png" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/yyc3-pwa-icon.png" type="image/png" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Phase 2: Critical Resource Hints for Core Web Vitals Optimization -->
    <!-- LCP Optimization: Preload critical above-the-fold resources -->
    <link rel="preload" href="/yyc3.png" as="image" type="image/png" />
    <link rel="preload" href="/src/main.tsx" as="script" type="module" />

    <!-- DNS Prefetch for API endpoints (reduces connection time) -->
    <link rel="dns-prefetch" href="https://api.coingecko.com" />
    <link rel="dns-prefetch" href="https://stream.binance.com:9443" />

    <!-- Preload Google Fonts with font-display: swap (via CSS) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>

    <!-- CLS Prevention: Declare font metrics to prevent layout shift -->
    <style>
      /* Font loading optimization - prevent FOIT/FOUT */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Inter'), local('Inter-Regular');
      }

      /* Critical CSS for above-the-fold content */
      body {
        margin: 0;
        padding: 0;
        background-color: #071425;
        color: #CCD6F6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Prevent layout shift during loading */
      #root {
        min-height: 100vh;
      }

      /* Loading skeleton animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .skeleton {
        background: linear-gradient(90deg, #112240 25%, #1a365d 50%, #112240 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
