version: 2
updates:
  # npm 依赖（pnpm）
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'
    groups:
      # 将 Vite / Vitest 生态统一为一组，避免出现 vitest 升级但 coverage-v8 未同步的情况
      vitest-vite:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vite'
          - '@vitejs/*'
          - '@tailwindcss/*'
      react-ecosystem:
        patterns:
          - 'react*'
          - '@types/react*'
      radix-ui:
        patterns:
          - '@radix-ui/*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci(deps)'
