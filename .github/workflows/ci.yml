name: YYC3-QATS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm run typecheck

      - name: ESLint Check
        run: pnpm run lint
        continue-on-error: true

      - name: Unit Tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Performance Baseline Check
        run: |
          BASELINE=$(cat .performance-baseline.json)
          BUILD_SIZE=$(du -sk dist/ | awk '{print $1}')
          THRESHOLD=$(echo "$BASELINE" | python3 -c "import sys,json; print(json.load(sys.stdin)['thresholds']['buildSizeKBMax'])")
          echo "Build size: ${BUILD_SIZE}KB (threshold: ${THRESHOLD}KB)"
          if [ "$BUILD_SIZE" -gt "$THRESHOLD" ]; then
            echo "::warning::Build size ${BUILD_SIZE}KB exceeds threshold ${THRESHOLD}KB"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://trading.yyc3.vip
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
